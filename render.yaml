# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# A single same-origin preview service avoids cross-site refresh-cookie issues.
# For a CDN frontend + API deployment, see docs/DEPLOYMENT.md.
services:
  - type: web
    name: localcart
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -w server
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SERVE_CLIENT
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: PICKUP_ENCRYPTION_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
